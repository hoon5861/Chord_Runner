<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chord Runner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500;600&family=Noto+Serif+KR:wght@400;600&family=Noto+Music&display=swap">
<style>
:root{--bg:#e3e8eb;--panel:#fff;--ink:#14212b;--mute:#5d6c78;--line:#c9d2d8;--acc:#2446c8;--soft:#e4e9ff;--paper:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--panel:#18212a;--ink:#e6ecf0;--mute:#93a3af;--line:#2e3b46;--acc:#8ea6ff;--soft:#26325e;--paper:#18212a}}
:root[data-theme="dark"]{--bg:#10171d;--panel:#18212a;--ink:#e6ecf0;--mute:#93a3af;--line:#2e3b46;--acc:#8ea6ff;--soft:#26325e;--paper:#18212a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'Noto Serif','Noto Serif KR',Georgia,'Times New Roman',serif}
.wrap{max-width:1560px;margin:0 auto;padding:10px 14px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
h1{font:500 32px/1.1 'Noto Serif','Noto Serif KR',Georgia,'Times New Roman',serif;margin:0;padding-right:8px;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.bar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
select,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg label{padding:6px 14px;cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){background:var(--acc);color:#fff}
.seg label:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:-3px}
#status{color:var(--mute);font-size:13px;max-width:520px}
.main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:center}
@media(max-width:700px){.main{grid-template-columns:1fr}}
#chord{font:500 clamp(44px,10vw,92px)/1.05 'Noto Serif','Noto Serif KR',Georgia,'Times New Roman',serif;height:1.15em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
#chord .sl{color:var(--mute);padding:0 .12em;font-weight:400}
#chord .bs{color:var(--acc)}
.dim #chord,.dim #roman{opacity:.4}
#roman{font:500 22px 'Noto Serif','Noto Serif KR',Georgia,'Times New Roman',serif;color:var(--acc);height:1.5em;line-height:1.5em;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--soft);border-radius:999px;padding:2px 11px;font-size:14px}
.alts{color:var(--mute);font-size:14px}
.alts b{color:var(--ink);font-weight:600}
.score{background:#fff;border-color:var(--line);padding:6px}
#staff{width:100%;height:clamp(286px,calc(100vh - 524px),516px);display:block}
#staff line{stroke:#2a2722;stroke-width:1.3}
#staff line.lg{stroke-width:1.8}
#staff line.st{stroke-width:1.3}
#staff .ac{fill:#2a2722;stroke:none}
#staff g.red .nh,#staff g.red .ac{fill:#d32f2f}
#staff g.red line{stroke:#d32f2f}
#staff text.clef{font:40px 'Noto Music','Noto Sans Symbols 2','Apple Symbols',serif;fill:#2a2722}
#staff .br{fill:#2a2722;stroke:none}
#staff .cl{fill:none;stroke:#2a2722;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
#staff .nh{fill:#2a2722}
#staff .ni{fill:#fff}
#staff text{fill:#2a2722;font:25px 'Noto Serif','Noto Serif KR',Georgia,'Times New Roman',serif}
.pwrap{overflow-x:auto;border-radius:0;-webkit-overflow-scrolling:touch}
#piano{position:relative;height:110px;min-width:1250px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.k{position:absolute;top:0;cursor:pointer}
.k.w{height:100%;background:#fafafa;border:1px solid #9aa5ad;border-radius:0 0 4px 4px;z-index:1;display:flex;align-items:flex-end;justify-content:center}
.k.w b{font-size:11px;color:#55616b;padding-bottom:3px;pointer-events:none}
.k.b{height:62%;background:#1b2229;border-radius:0 0 3px 3px;z-index:2}
.k.on.w{background:var(--acc)}.k.on.w b{color:#fff}
.k.on.b{background:var(--acc);box-shadow:0 0 0 2px #fff inset}
.hint{color:var(--mute);font-size:13px;margin-top:8px}
.help{margin-top:10px;padding:10px 14px;border-left:3px solid var(--acc);background:var(--soft);border-radius:4px;font-size:14px}
.help:empty{display:none}
.help ol{margin:6px 0 0;padding-left:20px}
input[type=number]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
#ptarget{font:500 clamp(30px,3.2vw,46px)/1.1 'Noto Serif','Noto Serif KR',Georgia,'Times New Roman',serif;margin-top:4px}
#pdots{margin-top:4px;height:24px;line-height:24px}
#pinfo{height:64px;overflow:hidden}
#ptarget{height:54px;overflow:hidden}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:stretch}
.card,.main>div{min-width:0}
.duo .main{grid-template-columns:minmax(0,1fr);gap:8px}
.duo #chord{font-size:clamp(36px,4.2vw,64px)}
.duo #out{order:-1}
.kl{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
#notes{height:30px;margin:6px 0;flex-wrap:nowrap;overflow:hidden}
#alts{height:42px;overflow:hidden}
.opts{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
.duo.top{grid-template-columns:auto 1fr 1fr;align-items:center}
@media(max-width:900px){.duo,.duo.top{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<section class="card" style="display:none"><div id="status">MIDI 확인 중…</div><div id="diag" class="hint" style="margin:4px 0 0"></div><div id="help" class="help"></div><div id="ports" class="hint" style="margin:4px 0 0"></div><div id="tips" class="help"></div><div id="mon" class="hint" style="margin:4px 0 0">수신 대기 중: 연결 후 건반을 눌러 보세요.</div></section>

<h1>Chord Runner</h1>
<div class="duo">
<section class="card bar" aria-label="조 설정">
  <span class="seg" role="radiogroup" aria-label="Major/minor">
    <label><input type="radio" name="mode" value="major" checked>Major</label>
    <label><input type="radio" name="mode" value="minor">minor</label>
  </span>
  <label class="kl">Key <select id="key"></select></label>
  
  
</section>

<section class="card bar" aria-label="MIDI">
  <button id="midibtn" type="button">MIDI 연결</button>
  <label class="kl">입력 장치 <select id="dev"><option value="">모든 장치</option></select></label>
</section>
</div>

<div class="duo">
<section class="card" id="pcard">
  <div class="bar"><strong>연습 모드</strong>
  <label>진행 <select id="ptype"><option value="major">Major ii–V–I</option><option value="minor">minor ii–V–I</option></select></label>
  <label>BPM <input id="bpm" type="number" min="0" max="240" value="90" style="width:76px"></label>
  <label>코드당 연주 횟수 <select id="pneed"><option value="1">1회</option><option value="2">2회</option><option value="3">3회</option><option value="4">4회</option><option value="5">5회</option><option value="6">6회</option><option value="7">7회</option><option value="8">8회</option></select></label>
  <div class="opts"><label><input type="checkbox" id="rootless"> 루트 생략 허용</label><label><input type="checkbox" id="fifthless"> 5음 생략 허용</label><button id="pgo" type="button">연습 시작</button></div></div>
  <div id="pinfo" class="hint"></div><div id="ptarget"></div><div id="pdots"></div>
</section>

<section class="card" id="out">
  <div class="main">
    <div><div id="chord" aria-live="polite">–</div><div id="roman"></div></div>
    <div><div class="chips" id="notes"></div><div class="alts" id="alts"></div></div>
  </div>
</section>

</div>

<section class="card score"><svg id="staff" viewBox="0 0 600 250" role="img" aria-label="큰 보표"></svg></section>

<section class="card">
  <div class="pwrap" id="pw"><div id="piano"></div></div>
  
</section>
</div>

<script>
const $=id=>document.getElementById(id);
const NAT={C:0,D:2,E:4,F:5,G:7,A:9,B:11},LET='CDEFGAB',SH='FCGDAEB',FL='BEADGCF',SY={'-1':'♭','0':'','1':'♯'};
const SHARP=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'],FLAT=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
let mode='major',fifths=0,sig={},pcName=[],diaPc=new Set(),tonicPc=0;
const fx=s=>s.replace(/b(?=\d)/g,'♭').replace(/#/g,'♯');

function lof(p){const i=p+1;return 'FCGDAEB'[((i%7)+7)%7]+['♭','','♯'][Math.floor(i/7)+1]}
const tonicName=f=>lof(mode==='major'?f:f+3);
function fillKeys(){
  $('key').innerHTML='';
  for(let f=-7;f<=7;f++){const o=document.createElement('option');o.value=f;
    o.textContent=tonicName(f)+(mode==='major'?' Major':' minor')+(f?'  '+(f<0?'♭'+(-f):'♯'+f):'');
    $('key').appendChild(o)}
  $('key').value=fifths;
}
function setKey(){
  sig={};(fifths>0?SH:FL).slice(0,Math.abs(fifths)).split('').forEach(l=>sig[l]=fifths>0?1:-1);
  pcName=Array(12);diaPc=new Set();
  for(const l of LET){const a=sig[l]||0,pc=(NAT[l]+a+12)%12;pcName[pc]=l+SY[a];diaPc.add(pc)}
  const t=tonicName(fifths);tonicPc=(NAT[t[0]]+(t[1]==='♯'?1:t[1]==='♭'?-1:0)+12)%12;
  for(let pc=0;pc<12;pc++)if(!pcName[pc]){
    pcName[pc]=fifths>0?SHARP[pc]:fifths<0?FLAT[pc]:(mode==='major'?(pc===6?'F♯':FLAT[pc]):(pc===8?'G♯':pc===6?'F♯':FLAT[pc]));
  }
  if(mode==='minor'){const l7=LET[(LET.indexOf(t[0])+6)%7],a=(sig[l7]||0)+1;
    if(a<=1)pcName[(NAT[l7]+a+12)%12]=l7+SY[a]}
  
  render();
}

/* ---- 코드 분석 ---- */
function analyze(S){
  const h=i=>S.has(i);let c=0,q='',rest='';
  if(S.size===2)return h(7)?{q:'',rest:'5',c:.2}:null;
  const third=h(4)?4:h(3)?3:0;let sus=0;
  if(!third){if(h(5))sus=4;else if(h(2))sus=2}
  const fifth=h(7)?7:h(6)?6:h(8)?8:0;
  let sev=h(11)?11:h(10)?10:0,dim7=false;
  if(!sev&&h(9)&&third===3&&fifth===6&&!h(7)){dim7=true;sev=9}
  const alts=[];let top=0,ad=0,six=0;
  if(sev){
    top=7;
    if(h(9)&&!dim7)top=13;else if(h(5)&&third===3)top=11;else if(h(2))top=9;
    if(sus===2&&top===9)top=7;
    if(dim7){q='dim';rest='7'}
    else{
      if(third===3)q='m';
      rest=(sev===11?(third===3?'(maj'+top+')':'maj'+top):String(top))+(sus?'sus'+sus:'');
      if(fifth===6)alts.push('b5');
      if(fifth===8)alts.push('#5');
    }
    if(third===4&&h(5))alts.push('11');
  }else if(h(9)){
    six=1;if(third===3)q='m';
    rest=(h(2)&&sus!==2)?'6/9':'6';if(sus)rest+='sus'+sus;
    if(fifth===6)alts.push('b5');if(fifth===8)alts.push('#5');
  }else{
    if(third===3)q=(fifth===6)?'dim':'m';
    else if(third===4&&fifth===8)q='aug';
    if(sus)rest='sus'+sus;
    const a=[];if(h(2)&&sus!==2)a.push('9');if(h(5)&&third)a.push('11');
    if(a.length){ad=1;rest+=(sus?'(add'+a.join('/')+')':'add'+a.join('/'))}
    if(fifth===6&&q!=='dim')alts.push('b5');
    if(fifth===8&&q!=='aug')alts.push('#5');
  }
  if(h(1))alts.push('b9');
  if(h(3)&&third===4)alts.push('#9');
  if(h(6)&&fifth===7)alts.push('#11');
  if(h(8)&&fifth===7)alts.push('b13');
  c+=alts.length*.7+(sus?.5:0)+(!third&&!sus?.4:0)+(fifth?0:.25)+six*.2+ad*.25+(top===9?.1:top===11?.2:top===13?.3:0);
  if(alts.length){
    if(q==='m'&&rest==='7'&&alts.length===1&&alts[0]==='b5'){rest='7b5';c-=.5}
    else rest+='('+alts.join(',')+')';
  }
  return{q,rest,c};
}
function detect(notes){
  const bass=notes[0]%12,pcs=[...new Set(notes.map(n=>n%12))],res=[];
  for(const r of pcs){
    const a=analyze(new Set(pcs.map(p=>(p-r+12)%12)));if(!a)continue;
    res.push({r,bass,q:a.q,rest:a.rest,c:a.c+(r===bass?0:.45)-(diaPc.has(r)?.05:0)-(mode==='minor'&&a.q===''&&/^(7|9|11|13)\(.*(b9|#9)/.test(a.rest)?.6:0)});
  }
  return res.sort((x,y)=>x.c-y.c);
}
const base=x=>pcName[x.r]+x.q+fx(x.rest);
const full=x=>base(x)+(x.r!==x.bass?'/'+pcName[x.bass]:'');
function roman(x){
  const d=(x.r-tonicPc+12)%12;
  const M=['I','♭II','II','♭III','III','IV','♯IV','V','♭VI','VI','♭VII','VII'];
  const m=['I','♭II','II','III','♯III','IV','♯IV','V','VI','♯VI','VII','♯VII'];
  let n=(mode==='major'?M:m)[d];if(x.q==='m'||x.q==='dim')n=n.toLowerCase();
  return n+(x.q==='dim'?'°':x.q==='aug'?'+':'')+fx(x.rest);
}

/* ---- 악보 ---- */
function info(m){
  const nm=pcName[m%12],l=nm[0],acc=nm[1]==='♯'?1:nm[1]==='♭'?-1:0,oct=Math.floor((m-acc)/12)-1;
  const sa=sig[l]||0;
  return{m,nm,oct,acc,step:oct*7+LET.indexOf(l),show:acc!==sa?(acc===1?'♯':acc===-1?'♭':'♮'):''};
}
function ivName(lo,hi){
  const a=info(lo),b=info(hi),d=hi-lo,n=b.step-a.step+1,sim=(n-1)%7,base=[0,2,4,5,7,9,11][sim]+12*Math.floor((n-1)/7),df=d-base,per=sim===0||sim===3||sim===4;
  const q=per?(df===0?'Perfect':df===1?'Augmented':df===-1?'diminished':df>1?'Doubly augmented':'Doubly diminished'):(df===0?'Major':df===-1?'minor':df===1?'Augmented':df===-2?'diminished':df>1?'Doubly augmented':'Doubly diminished');
  const o=n%10===1&&n%100!==11?'st':n%10===2&&n%100!==12?'nd':n%10===3&&n%100!==13?'rd':'th';
  const nm=n===1?'Unison':n===8?'Octave':n===15?'Double octave':n===22?'Triple octave':n+o;
  return{n:(q==='Perfect'&&(n===15||n===22)?'':q+' ')+nm,t:d%12===6};
}
let FONT_OK=false;
if(document.fonts&&document.fonts.load)document.fonts.load('40px "Noto Music"','\u{1D11E}\u{1D122}').then(f=>{if(f.length){FONT_OK=true;render()}}).catch(()=>{});
function fitClefs(T0,B0){
  const f=(id,top,h)=>{const e=$(id);if(!e)return;const b=e.getBBox();if(!b.height)return;const k=h/b.height;e.setAttribute('transform',`translate(${18-b.x*k} ${top-b.y*k}) scale(${k})`)};
  f('ctr',T0-14,70);
  const e=$('cba');
  if(e){try{const c=fitClefs.c||(fitClefs.c=document.createElement('canvas').getContext('2d'));c.font='40px "Noto Music","Noto Sans Symbols 2","Apple Symbols",serif';const m=c.measureText('\u{1D122}'),h=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;if(!(h>0))throw 0;const k=43/h;e.setAttribute('transform',`translate(${18+m.actualBoundingBoxLeft*k} ${B0+m.actualBoundingBoxAscent*k}) scale(${k})`)}catch(x){f('cba',B0-3,42)}}
}
function brace(L,T0,B0){
  const y0=T0,y1=B0+40,ym=(y0+y1)/2,h=y1-y0,xt=L-3,xo=L-13.5,xi=L-8.9,xc=L-21,f=v=>v.toFixed(1);
  return `M${f(xt)} ${f(y0)}C${f(xt-8)} ${f(y0+4)} ${f(xo)} ${f(y0+.12*h)} ${f(xo)} ${f(y0+.28*h)}C${f(xo)} ${f(y0+.4*h)} ${f(xo-3)} ${f(ym-.06*h)} ${f(xc)} ${f(ym)}C${f(xo-3)} ${f(ym+.06*h)} ${f(xo)} ${f(y1-.4*h)} ${f(xo)} ${f(y1-.28*h)}C${f(xo)} ${f(y1-.12*h)} ${f(xt-8)} ${f(y1-4)} ${f(xt)} ${f(y1)}C${f(xt-6)} ${f(y1-5)} ${f(xi)} ${f(y1-.12*h)} ${f(xi)} ${f(y1-.28*h)}C${f(xi)} ${f(y1-.38*h)} ${f(xi-4)} ${f(ym+.07*h)} ${f(xc)} ${f(ym)}C${f(xi-4)} ${f(ym-.07*h)} ${f(xi)} ${f(y0+.38*h)} ${f(xi)} ${f(y0+.28*h)}C${f(xi)} ${f(y0+.12*h)} ${f(xt-6)} ${f(y0+5)} ${f(xt)} ${f(y0)}Z`;
}
function acc(k,x,y){
  const g=k==='#'?'<path d="M-5.5 -3.2L5.5 -7.2V-4.2L-5.5 -0.2Z M-5.5 4.8L5.5 0.8V3.8L-5.5 7.8Z"/><rect x="-3" y="-13" width="1" height="26.5"/><rect x="2" y="-14.5" width="1" height="26.5"/>'
   :k==='b'?'<path fill-rule="evenodd" transform="translate(-4 -1.5)" d="M0 7.8V-17.6H1.2V-3C3 -6 9 -5.5 9 -0.2C9 3 5 5.5 0 7.8Z M1.2 5.2C5.5 3 7 1.8 7 -0.4C7 -2.5 4.5 -3.2 1.2 0.5Z"/>'
   :'<path d="M-3 -3.5L3 -6.5V-3.5L-3 -0.5Z M-3 2.5L3 -0.5V2.5L-3 5.5Z"/><rect x="-3" y="-14" width="1" height="19.5"/><rect x="2" y="-6.5" width="1" height="20.5"/>';
  return `<g class="ac" transform="translate(${x} ${y})">${g}</g>`;
}
const hd=(cx,cy,half)=>half
  ?`<ellipse class="nh" cx="${cx}" cy="${cy}" rx="6.4" ry="4.9" transform="rotate(-22 ${cx} ${cy})"/>`
  :`<ellipse class="nh" cx="${cx}" cy="${cy}" rx="8.4" ry="5"/><ellipse class="ni" cx="${cx}" cy="${cy}" rx="3.2" ry="4.4" transform="rotate(-48 ${cx} ${cy})"/>`;
function staff(notes,xs,wrong){
  let y0=0,y1=250;const T0=70,B0=170,L=10,R=(xs?Math.max(600,xs[xs.length-1]+50):600)-10,yT=s=>T0+40-(s-30)*5,yB=s=>B0+40-(s-18)*5;
  let s='';
  for(let i=0;i<5;i++)s+=`<line x1="${L}" x2="${R}" y1="${T0+i*10}" y2="${T0+i*10}"/><line x1="${L}" x2="${R}" y1="${B0+i*10}" y2="${B0+i*10}"/>`;
  const mid=(T0+B0+40)/2;
  s+=`<line x1="${L}" x2="${L}" y1="${T0}" y2="${B0+40}"/><line x1="${R-6}" x2="${R-6}" y1="${T0}" y2="${B0+40}"/><line x1="${R}" x2="${R}" y1="${T0}" y2="${B0+40}" style="stroke-width:3.2"/><path class="br" d="${brace(L,T0,B0)}"/>`;

    buildProg();setTimer();tick();
  }else{clearInterval(P.timer);$('pdots').innerHTML='';P.notes=[];P.chords=[];applyKey(P.type,0)}
  $('pgo').textContent=P.on?'연습 종료':'연습 시작';
  $('key').disabled=P.on;$('ptype').disabled=P.on;document.querySelectorAll('input[name=mode]').forEach(r=>r.disabled=P.on);
  pui();render();
});
$('bpm').addEventListener('change',()=>{bv();if(P.on)setTimer()});
$('ptype').addEventListener('change',()=>{P.type=$('ptype').value});
$('pneed').addEventListener('change',()=>{P.need=nv();$('pneed').value=P.need;P.done=0;pui();render()});
['rootless','fifthless'].forEach(id=>$(id).addEventListener('change',()=>{if(P.on){setNotes();render()}}));

/* ---- UI ---- */
document.querySelectorAll('input[name=mode]').forEach(r=>r.addEventListener('change',()=>{mode=r.value;fillKeys();setKey()}));
$('key').addEventListener('change',e=>{fifths=+e.target.value;setKey()});

fillKeys();setKey();
</script>
</body>
</html>
